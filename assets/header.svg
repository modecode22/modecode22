<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="Moncef Aissaoui, full-stack engineer">
  <style>
    .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; }
    .w { opacity: 0; animation: cyc 15s infinite; }
    @keyframes cyc {
      0%   { opacity: 0 }
      2%   { opacity: 1 }
      18%  { opacity: 1 }
      20%  { opacity: 0 }
      100% { opacity: 0 }
    }
    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 0%, 50% { opacity: 1 } 51%, 100% { opacity: 0 } }
    .node { animation: pulse 3.2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .45 } 50% { opacity: 1 } }
    .link { stroke-dasharray: 4 6; animation: flow 3s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -20 } }
    .hub { animation: hub 3.2s ease-in-out infinite; }
    @keyframes hub { 0%, 100% { r: 7 } 50% { r: 9 } }
  </style>

  <defs>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#32302f"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#fabd2f"/>
      <stop offset="35%"  stop-color="#fe8019"/>
      <stop offset="70%"  stop-color="#b8bb26"/>
      <stop offset="100%" stop-color="#83a598"/>
    </linearGradient>
    <clipPath id="round"><rect width="1200" height="240" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="240" fill="#1d2021"/>
    <rect width="1200" height="240" fill="url(#grid)"/>
    <rect width="6" height="240" fill="url(#accent)"/>

    <g>
      <rect x="56"  y="42" width="9" height="9" fill="#fb4934"/>
      <rect x="72"  y="42" width="9" height="9" fill="#fabd2f"/>
      <rect x="88"  y="42" width="9" height="9" fill="#b8bb26"/>
      <rect x="104" y="42" width="9" height="9" fill="#8ec07c"/>
      <rect x="120" y="42" width="9" height="9" fill="#83a598"/>
      <rect x="136" y="42" width="9" height="9" fill="#d3869b"/>
    </g>

    <text class="mono" x="56" y="112" font-size="46" font-weight="700" fill="#ebdbb2" letter-spacing="-1.5">moncef aissaoui</text>
    <text class="mono" x="58" y="146" font-size="18" fill="#928374">full-stack engineer, i take products from empty schema to live domain</text>

    <rect class="caret" x="57" y="176" width="9" height="17" fill="#b8bb26"/>
    <text class="mono w" x="78" y="190" font-size="19" fill="#fabd2f" style="animation-delay:0s">web platforms</text>
    <text class="mono w" x="78" y="190" font-size="19" fill="#8ec07c" style="animation-delay:3s">mobile apps</text>
    <text class="mono w" x="78" y="190" font-size="19" fill="#83a598" style="animation-delay:6s">edge APIs</text>
    <text class="mono w" x="78" y="190" font-size="19" fill="#fe8019" style="animation-delay:9s">AI products</text>
    <text class="mono w" x="78" y="190" font-size="19" fill="#d3869b" style="animation-delay:12s">design systems</text>

    <g stroke="#504945" stroke-width="1.2" fill="none">
      <line class="link" x1="990" y1="100" x2="900"  y2="68"/>
      <line class="link" x1="990" y1="100" x2="1012" y2="48"/>
      <line class="link" x1="990" y1="100" x2="1104" y2="98"/>
      <line class="link" x1="990" y1="100" x2="958"  y2="134"/>
      <line class="link" x1="990" y1="100" x2="1062" y2="166"/>
      <line class="link" x1="990" y1="100" x2="884"  y2="176"/>
    </g>
    <circle class="node" cx="900"  cy="68"  r="5" fill="#fabd2f" style="animation-delay:0s"/>
    <circle class="node" cx="1012" cy="48"  r="4" fill="#83a598" style="animation-delay:.4s"/>
    <circle class="node" cx="1104" cy="98"  r="5" fill="#8ec07c" style="animation-delay:.8s"/>
    <circle class="node" cx="958"  cy="134" r="4" fill="#b8bb26" style="animation-delay:1.2s"/>
    <circle class="node" cx="1062" cy="166" r="5" fill="#fe8019" style="animation-delay:1.6s"/>
    <circle class="node" cx="884"  cy="176" r="4" fill="#fb4934" style="animation-delay:2s"/>
    <circle class="hub"  cx="990"  cy="100" r="7" fill="#ebdbb2"/>

    <text class="mono" x="1144" y="216" font-size="12" fill="#504945" text-anchor="end">algeria</text>
  </g>
</svg>
